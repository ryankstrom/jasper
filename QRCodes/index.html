<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasper · QR Code Generator</title>
<meta name="description" content="Make QR codes with your own colours, pixel shapes and centre logo. Generated in your browser.">
<link rel="icon" type="image/svg+xml" href="brand/jasper-icon-cyan.svg">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<!-- link previews (iMessage, WhatsApp, Slack…): these need a PNG at an absolute URL -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jasper">
<meta property="og:title" content="Jasper · QR Code Generator">
<meta property="og:description" content="Make QR codes with your own colours, pixel shapes and centre logo.">
<meta property="og:url" content="https://qrcodes.jasper.tools/">
<meta property="og:image" content="https://qrcodes.jasper.tools/brand/jasper-share.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="Jasper">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="brandbar">
  <a href="https://jasper.tools" class="home" title="All Jasper tools"><img class="logo" src="brand/jasper-logo-white.svg" alt="Jasper"></a>
  <div class="divider"></div>
  <div class="title">QR Code <b>Generator</b></div>
</header>
<div class="app">
  <p class="subtitle">Pick your colours and pixel shape, and add a logo in the middle if you like. Everything is made in your browser; nothing is uploaded.</p>

  <div class="layout">
    <form class="controls" id="controls">

      <section class="field">
        <label for="content">Content</label>
        <textarea id="content" rows="3" placeholder="Enter a URL or text">https://jasper.tools</textarea>
      </section>

      <section class="field field-row">
        <div class="field-half">
          <label for="fgColor">Foreground colour</label>
          <input type="color" id="fgColor" value="#000000">
        </div>
        <div class="field-half">
          <label for="bgColor">Background colour</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </section>

      <section class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="transparentBg">
          Transparent background
        </label>
      </section>

      <section class="field">
        <label for="pixelShape">Pixel shape</label>
        <select id="pixelShape">
          <option value="square">Square</option>
          <option value="rounded" selected>Rounded</option>
          <option value="extra-rounded">Extra rounded</option>
          <option value="dots">Dots</option>
          <option value="classy">Classy (cut corners)</option>
          <option value="diamond">Diamond</option>
        </select>
      </section>

      <section class="field field-row">
        <div class="field-half">
          <label for="errorLevel">Error correction</label>
          <select id="errorLevel">
            <option value="L">Low (L)</option>
            <option value="M" selected>Medium (M)</option>
            <option value="Q">Quartile (Q)</option>
            <option value="H">High (H)</option>
          </select>
        </div>
        <div class="field-half">
          <label for="sizePx">Download size (px)</label>
          <input type="number" id="sizePx" value="800" min="100" max="4000" step="20">
        </div>
      </section>

      <section class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="showMargin" checked>
          Include quiet-zone margin
        </label>
      </section>

      <section class="field">
        <label for="logoInput">Centre image</label>
        <div class="file-row">
          <input type="file" id="logoInput" accept="image/*">
          <button type="button" id="clearLogo" class="btn-secondary" hidden>Remove</button>
        </div>
      </section>

      <section class="field" id="logoOptions" hidden>
        <label for="logoSize">Logo size — <span id="logoSizeVal">22%</span></label>
        <input type="range" id="logoSize" min="10" max="35" value="22">
        <label class="checkbox-label">
          <input type="checkbox" id="logoBackdrop" checked>
          White backdrop behind the image
        </label>
      </section>

      <p class="hint" id="scanHint" hidden></p>

      <section class="field">
        <button type="button" id="downloadPng" class="btn-primary">Download PNG</button>
      </section>
    </form>

    <div class="preview">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>
  </div>
</div>
<footer>Jasper · SLR Consulting · <a href="https://jasper.tools">More Jasper tools</a></footer>

<script src="qrcode-generator.js"></script>
<script src="app.js"></script>
</body>
</html>
